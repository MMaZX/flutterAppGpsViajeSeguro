name: app_viaje_seguro
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.3

dependencies:
  dio: ^5.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_map: ^7.0.2
  flutter_map_cache: ^2.0.0
  flutter_map_marker_cluster: ^1.4.0
  flutter_riverpod: ^2.5.1
  flutter_svg: ^2.0.10+1
  geolocator: ^13.0.1
  google_fonts: ^6.2.1
  latlong2: ^0.9.1
  local_auth: ^2.3.0
  lucide_icons_flutter: ^1.2.6
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  shadcn_ui: ^0.16.3
  shared_preferences: ^2.3.2
  socket_io_client: ^2.0.3+1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/inter/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/inter/Inter_28pt-Black.ttf
          weight: 900
        - asset: assets/inter/Inter_28pt-Bold.ttf
          weight: 700
        - asset: assets/inter/Inter_28pt-ExtraBold.ttf
          weight: 800
        - asset: assets/inter/Inter_28pt-ExtraLight.ttf
          weight: 200
        - asset: assets/inter/Inter_28pt-Light.ttf
          weight: 300
        - asset: assets/inter/Inter_28pt-Medium.ttf
          weight: 500
        - asset: assets/inter/Inter_28pt-Regular.ttf
          weight: 400
        - asset: assets/inter/Inter_28pt-SemiBold.ttf
          weight: 600
        - asset: assets/inter/Inter_28pt-Thin.ttf
          weight: 100
